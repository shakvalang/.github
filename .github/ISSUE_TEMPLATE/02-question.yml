name: ❓ Open question
description: Something knowingly left undone, and the way to do it is open 🤔
title: "[Question]: "
labels: ["question"]
projects: ["shakvalang/1"]
assignees:
  - FilaCo
body:
  - type: textarea
    attributes:
      label: Context
      description: What is left undone, what it blocks, and the zen lines, references (R#), rules (L#, C#) and decisions (D#) it touches.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Options
      description: The ways to do it known so far, and what would decide between them. An ADR, a rule or a spec section that closes the question names this issue.
    validations:
      required: false
