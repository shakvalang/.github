name: 🚀 Feature Request
description: If you have a feature request 💡
title: "[Feature]: "
type: Feature
projects: ["canarylang/1"]
assignees:
  - FilaCo
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request! Check it against
        [the zen](https://github.com/canarylang/canary/blob/master/docs/src/zen.md) first.
  - type: textarea
    attributes:
      label: Context
      description: What are you trying to write and how would you want to write it? Is it something you currently cannot do? Is this related to an issue/problem?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: Can you achieve the same result doing it in an alternative way? Is the alternative considerable? Which zen line does the feature serve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Has the feature been requested before?
      description: Please provide a link to the issue.
    validations:
      required: false
  - type: dropdown
    attributes:
      label: If the feature request is approved, would you be willing to submit a PR?
      description: |
        Help can be provided if you need assistance submitting a PR
      options:
        - 'Yes'
        - 'No'
      default: 1
    validations:
      required: true
